 <meta charset="UTF-8" />
<!-- Estilos generales -->
<link rel="stylesheet" href="../../general/animate.css" />
<link rel="stylesheet" href="../../general/chapters.css" />
<link rel="stylesheet" href="../../general/colors-v3.css" />
<link rel="stylesheet" href="../../general/commerce-js.css" />
<link rel="stylesheet" href="../../general/fluidable-min.css" />
<link rel="stylesheet" href="../../general/icons-v3.css" />
<link rel="stylesheet" href="../../general/jquery.fullPage.css" />
<link rel="stylesheet" href="../../general/main-v3.css" />
<link rel="stylesheet" href="../../general/sonar.min.css" />

<!-- Estilos específicos -->
<link rel="stylesheet" href="ficha303-contenido2.css" />
<script src="bio2024-303-scripts.js" defer></script>

<div class="container">
  <div class="container_title">
    <i class="icon icon_h2 bars bg-blue_pacific"></i>
    <h2 class="align-l color-gris-osc">
      Índice de importancia cultural y usos por especie
    </h2>
  </div>
  <div class="col-group">
    <div class="filters col-dt-3">
      <h3 class="align-l color-gris-osc title-filter">Filtra por:</h3>

      <!-- Grupo biológico -->
      <div class="filter-section">
        <h4 class="align-l color-gris-osc subtitle-group">Grupo biológico</h4>
        <div class="filter-options biological-filters">
          <label class="filter-option biological">
            <input
              type="radio"
              name="biological-group"
              value="Reptil"
              checked
            />
            <div class="custom-radio reptil">
              <img
                src="./input/img/Ficha-303-icono-reptil.png"
                alt="Reptil"
                class="filter-icon"
              />
            </div>
            <span class="filter-label">Reptil</span>
          </label>
          <label class="filter-option biological">
            <input type="radio" name="biological-group" value="Ave" />
            <div class="custom-radio ave">
              <img
                src="./input/img/Ficha-303-icono-ave.png"
                alt="Ave"
                class="filter-icon"
              />
            </div>
            <span class="filter-label">Ave</span>
          </label>
          <label class="filter-option biological">
            <input type="radio" name="biological-group" value="Mamífero" />
            <div class="custom-radio mamifero">
              <img
                src="./input/img/Ficha-303-icono-mamifero.png"
                alt="Mamífero"
                class="filter-icon"
              />
            </div>
            <span class="filter-label">Mamífero</span>
          </label>
        </div>
      </div>

      <hr class="divider" />

      <!-- Filtro de usos - Desplegable con Checkboxes Sí/No -->
      <div class="filter-section">
        <div class="dropdown-header" id="usos-dropdown-header">
          <div class="dropdown-title">
            <span>Usos</span>
          </div>
          <div class="dropdown-icon" id="usos-dropdown-icon">▼</div>
        </div>
        <div class="dropdown-content" id="usos-dropdown-content">
          <!-- Alimento -->
          <div class="use-toggle-group">
            <div class="use-toggle-header">
              <div class="use-icon-header">
                <img
                  src="./input/img/Ficha-303-icono-alimento.png"
                  alt="Alimento"
                  class="use-header-icon"
                />
                <span>Alimento:</span>
                <div class="use-toggle-buttons">
                  <label class="switch-toggle">
                    <input type="checkbox" class="use-switch" data-use="alimento" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Comercio -->
          <div class="use-toggle-group">
            <div class="use-toggle-header">
              <div class="use-icon-header">
                <img
                  src="./input/img/Ficha-303-icono-comercio.png"
                  alt="Comercio"
                  class="use-header-icon"
                />
                <span>Comercio:</span>
                <div class="use-toggle-buttons">
                  <label class="switch-toggle">
                    <input type="checkbox" class="use-switch" data-use="comercio" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Mascota -->
          <div class="use-toggle-group">
            <div class="use-toggle-header">
              <div class="use-icon-header">
                <img
                  src="./input/img/Ficha-303-icono-mascota.png"
                  alt="Mascota"
                  class="use-header-icon"
                />
                <span>Mascota:</span>
                <div class="use-toggle-buttons">
                  <label class="switch-toggle">
                    <input type="checkbox" class="use-switch" data-use="mascota" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Artesanía -->
          <div class="use-toggle-group">
            <div class="use-toggle-header">
              <div class="use-icon-header">
                <img
                  src="./input/img/Ficha-303-icono-artesania.png"
                  alt="Artesanía"
                  class="use-header-icon"
                />
                <span>Artesanía:</span>
                <div class="use-toggle-buttons">
                  <label class="switch-toggle">
                    <input type="checkbox" class="use-switch" data-use="artesania" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Medicina -->
          <div class="use-toggle-group">
            <div class="use-toggle-header">
              <div class="use-icon-header">
                <img
                  src="./input/img/Ficha-303-icono-medicinal.png"
                  alt="Medicina"
                  class="use-header-icon"
                />
                <span>Medicina:</span>
                <div class="use-toggle-buttons">
                  <label class="switch-toggle">
                    <input type="checkbox" class="use-switch" data-use="medicina" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Filtro de índice de importancia cultural - Desplegable -->
      <div class="filter-section">
        <div class="dropdown-header" id="iic-dropdown-header">
          <div class="dropdown-title">
            <span>Índice de importancia cultural</span>
          </div>
          <div class="dropdown-icon" id="iic-dropdown-icon">▼</div>
        </div>
        <div class="dropdown-content" id="iic-dropdown-content">
          <div class="filter-options iic-filters">
            <label class="iic-filter-option">
              <input type="checkbox" name="iic-filter" value="Alto" />
              <div class="iic-color-circle alto"></div>
              <span class="iic-filter-label">Alto</span>
            </label>
            <label class="iic-filter-option">
              <input type="checkbox" name="iic-filter" value="Medio" />
              <div class="iic-color-circle medio"></div>
              <span class="iic-filter-label">Medio</span>
            </label>
            <label class="iic-filter-option">
              <input type="checkbox" name="iic-filter" value="Bajo" />
              <div class="iic-color-circle bajo"></div>
              <span class="iic-filter-label">Bajo</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Botón para limpiar filtros -->
      <button id="clear-filters" class="clear-filters-btn">
        Limpiar filtros
      </button>
    </div>

    <div class="cards col-dt-9">
      <h3 id="count" class="align-l color-gris-osc count-display">
        Mostrando 0 especies
      </h3>
      <div id="species-cards" class="species-grid"></div>
    </div>
  </div>
</div>

<div>
  <img src="" alt="">
</div>
