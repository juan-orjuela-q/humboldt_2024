<div class="align-l">
  <div class="title-container">
    <div>
      <i class="icon icon_h2 bars bg-orange"></i>
    </div>
    <h2 class="color-gris-osc">
      Riqueza de especies en los arreglos productivos encontrados en los Montes
      de María
    </h2>
  </div>
  <div class="interactive-map-container">
    <div class="col-group">
      <div class="col-dt-9">
        <div class="regions-section">
          <div class="region-item">
            <span class="region-color" style="background-color: #f59c00"></span>
            <span class="region-name"
              >Paisajes alrededor de los sistemas productivos.</span
            >
          </div>
          <div class="region-item">
            <span class="region-color" style="background-color: #75c8da"></span>
            <span class="region-name"
              >Sistemas productivos identificados en la región.</span
            >
          </div>
        </div>
        <div class="regions-section">
          <div class="region-item">
            <img
              src="https://reporte.humboldt.org.co/assets/img/2024/4/407/ficha-407-icono-nativa.png"
              alt="Nativa"
            />
            <span class="region-name">Nativa</span>
          </div>
          <div class="region-item">
            <img
              src="https://reporte.humboldt.org.co/assets/img/2024/4/407/ficha-407-icono-nativa-cultiva.png"
              alt="Nativa y cultivada"
            />
            <span class="region-name">Nativa y cultivada</span>
          </div>
          <div class="region-item">
            <img
              src="https://reporte.humboldt.org.co/assets/img/2024/4/407/ficha-407-icono-cultivos-introducidos.png"
              alt="Introducidos"
            />
            <span class="region-name">Cultivos introducidos</span>
          </div>
        </div>
        <div class="map-section">
          <div class="map-wrapper">
            <!-- Mapa de Sucre -->
            <img
              src="https://reporte.humboldt.org.co/assets/img/2024/4/407/ficha-407-imagen.png"
              alt="Mapa de Sucre"
              class="base-map"
            />

            <!-- Números en el mapa con tooltips -->
            <div class="map-numbers">
              <!-- Los números se agregarán dinámicamente -->
            </div>

            <!-- Tooltip para mostrar la imagen -->
            <div class="map-tooltip">
              <img src="" alt="" class="tooltip-image" />
            </div>
          </div>
        </div>
      </div>

      <div class="col-dt-3">
        <img
          src="https://reporte.humboldt.org.co/assets/img/2024/4/407/ficha-407-riquezas-espacios.png"
