<div class="align-l container">
  <div class="info-container">
    <div class="">
      <div class="title-container">
        <div>
          <i class="icon icon_h2 markermap bg-blue"></i>
        </div>
        <h2 class="color-gris-osc">
          Distribución de ataques de pumas y jaguares a animales domésticos en
          el PNNP
        </h2>
      </div>
      <div class="col-group">
        <div

          class="map-filters col-dt-4"

          <div class="checkbox-title-container">
            <div class="checkbox-container pnn-paramillo">
              <input type="checkbox" id="pnn-paramillo" checked />

            </div>
            <div class="checkbox-container ataques-jaguar">
              <input type="checkbox" id="ataques-jaguar" checked />

            <div class="checkbox-container influincia-paramillo">
              <input type="checkbox" id="influincia-paramillo" checked />

              </label>
            </div>
            <div class="checkbox-container ataques-puma">
              <input type="checkbox" id="ataques-puma" checked />

            </div>
            <div class="checkbox-container resguardos-indigenas">
              <input type="checkbox" id="resguardos-indigenas" checked />

            <img src="./input/img/ficha-301-mapa-general.png" alt="Mapa colombia" />

            <img

            <img
              src="./input/img/ficha-301-mapa-jaguar.png"
              id="img-ataques-jaguar"
              alt="Ataques de jaguar"
            />
            <img
              src="./input/img/ficha-301-mapa-pnn.png"
              id="img-influincia-paramillo"
              alt="Influincia paramillo"
            />
            <img
              src="./input/img/ficha-301-mapa-puma.png"
              id="img-ataques-puma"
              alt="Ataques de puma"
            />
            <img
              src="./input/img/ficha-301-mapa-resguardos.png"
              id="img-resguardos-indigenas"
              alt="Resguardos indígenas"
